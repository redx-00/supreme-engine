name: Build standalone EXE

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish standalone EXE
        run: dotnet publish TerminalSpinner.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: TerminalSpinner-windows-x64
          path: bin/Release/net8.0/win-x64/publish/TerminalSpinner.exe
